<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Container Background -->
  <rect width="600" height="380" fill="#090d16"/>
  <rect width="600" height="380" fill="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
  </g>

  <!-- Top Navigation Mock -->
  <g transform="translate(60, 28)">
    <circle cx="10" cy="12" r="5" fill="#60a5fa"/>
    <text x="24" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">DevBlog</text>
    
    <!-- Nav Links -->
    <text x="310" y="15" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="500">Articles</text>
    <text x="370" y="15" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="500">Snippets</text>
    <text x="430" y="15" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="500">Subscribe</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(0, 100)">
    <!-- Main Headline matching reference -->
    <text x="300" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Better</text>
    <text x="300" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Ideas. Faster.</text>

    <!-- Subtitle -->
    <text x="300" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" text-anchor="middle">
      A minimal, blazingly fast publishing engine tailored for engineers.
    </text>

    <!-- Action Buttons -->
    <g transform="translate(205, 136)">
      <!-- Primary Pill -->
      <rect x="0" y="0" width="100" height="28" rx="14" fill="url(#btnGrad)"/>
      <text x="50" y="18" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Start Reading</text>

      <!-- Secondary Pill -->
      <rect x="110" y="0" width="80" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="150" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="500" text-anchor="middle">Explore</text>
    </g>

    <!-- Article Teaser Card -->
    <g transform="translate(130, 185)">
      <rect x="0" y="0" width="340" height="70" rx="10" fill="#111827" stroke="#1f293d" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#1e293b"/>
      <path d="M 23 28 L 28 33 L 34 23" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <text x="54" y="24" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Architecting Modern React Architecture in 2025</text>
      <text x="54" y="40" fill="#64748b" font-family="sans-serif" font-size="8">8 min read • React, Architecture, Performance</text>
    </g>
  </g>
</svg>
