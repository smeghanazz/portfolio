<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="600" height="380" fill="url(#bgGrad)"/>

  <!-- App Window Container -->
  <g transform="translate(40, 30)" filter="url(#cardShadow)">
    <rect width="520" height="320" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- App Header / Toolbar -->
    <path d="M 0 10 Q 0 0 10 0 L 510 0 Q 520 0 520 10 L 520 40 L 0 40 Z" fill="#ffffff"/>
    <line x1="0" y1="40" x2="520" y2="40" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="20" r="4" fill="#ef4444" opacity="0.75"/>
    <circle cx="34" cy="20" r="4" fill="#f59e0b" opacity="0.75"/>
    <circle cx="48" cy="20" r="4" fill="#10b981" opacity="0.75"/>

    <!-- Search Bar in Header -->
    <rect x="80" y="11" width="160" height="18" rx="5" fill="#f1f5f9"/>
    <circle cx="92" cy="20" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="94.5" y1="22.5" x2="97.5" y2="25.5" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="106" y="23.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">Search projects, tasks...</text>

    <!-- Header Avatar & Notif -->
    <circle cx="475" cy="20" r="7" fill="#e2e8f0"/>
    <circle cx="496" cy="20" r="9" fill="#3b82f6"/>
    <text x="496" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">AC</text>

    <!-- Sidebar -->
    <rect x="0" y="40" width="110" height="280" fill="#fcfdfe"/>
    <line x1="110" y1="40" x2="110" y2="320" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Sidebar menu items -->
    <rect x="10" y="55" width="90" height="22" rx="4" fill="#eff6ff"/>
    <circle cx="24" cy="66" r="3" fill="#3b82f6"/>
    <rect x="34" y="63" width="50" height="6" rx="2" fill="#3b82f6"/>

    <rect x="10" y="85" width="90" height="22" rx="4" fill="transparent"/>
    <circle cx="24" cy="96" r="3" fill="#94a3b8"/>
    <rect x="34" y="93" width="40" height="6" rx="2" fill="#cbd5e1"/>

    <rect x="10" y="115" width="90" height="22" rx="4" fill="transparent"/>
    <circle cx="24" cy="126" r="3" fill="#94a3b8"/>
    <rect x="34" y="123" width="55" height="6" rx="2" fill="#cbd5e1"/>

    <rect x="10" y="145" width="90" height="22" rx="4" fill="transparent"/>
    <circle cx="24" cy="156" r="3" fill="#94a3b8"/>
    <rect x="34" y="153" width="45" height="6" rx="2" fill="#cbd5e1"/>

    <!-- Main Content Area -->
    <g transform="translate(125, 52)">
      <!-- Title & Action -->
      <text x="0" y="12" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Project Overview</text>
      <rect x="310" y="2" width="65" height="16" rx="4" fill="#3b82f6"/>
      <text x="342.5" y="13" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" text-anchor="middle">+ New Task</text>

      <!-- Stat Cards -->
      <g transform="translate(0, 24)">
        <!-- Stat 1 -->
        <rect x="0" y="0" width="115" height="50" rx="6" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
        <text x="10" y="18" fill="#64748b" font-family="sans-serif" font-size="8" font-weight="500">Active Tasks</text>
        <text x="10" y="38" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">128</text>
        <text x="65" y="38" fill="#10b981" font-family="sans-serif" font-size="8" font-weight="600">+14%</text>

        <!-- Stat 2 -->
        <rect x="128" y="0" width="115" height="50" rx="6" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
        <text x="138" y="18" fill="#64748b" font-family="sans-serif" font-size="8" font-weight="500">Completed</text>
        <text x="138" y="38" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">84%</text>
        <text x="193" y="38" fill="#10b981" font-family="sans-serif" font-size="8" font-weight="600">+8.2%</text>

        <!-- Stat 3 -->
        <rect x="256" y="0" width="115" height="50" rx="6" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
        <text x="266" y="18" fill="#64748b" font-family="sans-serif" font-size="8" font-weight="500">Team Velocity</text>
        <text x="266" y="38" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">92.4</text>
      </g>

      <!-- Chart Card -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="371" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" fill="#334155" font-family="sans-serif" font-size="9" font-weight="600">Sprint Progress &amp; Burndown</text>

        <!-- Chart Grid Lines -->
        <line x1="12" y1="36" x2="359" y2="36" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="12" y1="56" x2="359" y2="56" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="12" y1="76" x2="359" y2="76" stroke="#f1f5f9" stroke-width="1"/>

        <!-- Filled Chart Area -->
        <path d="M 15 76 L 60 62 L 110 68 L 160 48 L 220 54 L 280 32 L 340 24 L 340 85 L 15 85 Z" fill="url(#chartGrad)"/>
        <!-- Chart Line -->
        <path d="M 15 76 L 60 62 L 110 68 L 160 48 L 220 54 L 280 32 L 340 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Data Points -->
        <circle cx="160" cy="48" r="3" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <circle cx="280" cy="32" r="3" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <circle cx="340" cy="24" r="3" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      </g>

      <!-- Task rows preview -->
      <g transform="translate(0, 194)">
        <rect x="0" y="0" width="371" height="50" rx="6" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
        
        <!-- Row 1 -->
        <rect x="10" y="10" width="12" height="12" rx="3" fill="#e2e8f0"/>
        <rect x="30" y="12" width="110" height="7" rx="2" fill="#334155"/>
        <rect x="250" y="11" width="45" height="12" rx="6" fill="#dbeafe"/>
        <text x="272" y="19.5" fill="#1d4ed8" font-family="sans-serif" font-size="7" font-weight="600" text-anchor="middle">In Review</text>

        <!-- Row 2 -->
        <rect x="10" y="28" width="12" height="12" rx="3" fill="#3b82f6"/>
        <path d="M 13 34 L 15 36 L 19 31" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="30" y="30" width="140" height="7" rx="2" fill="#94a3b8"/>
        <rect x="250" y="29" width="45" height="12" rx="6" fill="#dcfce7"/>
        <text x="272" y="37.5" fill="#15803d" font-family="sans-serif" font-size="7" font-weight="600" text-anchor="middle">Completed</text>
      </g>
    </g>
  </g>
</svg>
