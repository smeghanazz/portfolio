<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="financeLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#phoneBgGrad)"/>

  <!-- Phone Container in Center -->
  <g transform="translate(210, 20)" filter="url(#phoneShadow)">
    <!-- Outer phone chassis -->
    <rect x="0" y="0" width="180" height="340" rx="30" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <!-- Phone Screen -->
    <rect x="7" y="7" width="166" height="326" rx="24" fill="#ffffff"/>

    <!-- Dynamic Island / Speaker Pill -->
    <rect x="65" y="14" width="50" height="12" rx="6" fill="#0f172a"/>

    <!-- Status Bar (time & battery) -->
    <text x="26" y="24" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700">9:41</text>
    <circle cx="146" cy="21" r="2.5" fill="#0f172a"/>
    <rect x="151" y="19" width="10" height="5" rx="1.5" fill="none" stroke="#0f172a" stroke-width="1"/>
    <rect x="152" y="20" width="6" height="3" rx="0.5" fill="#0f172a"/>

    <!-- Screen Content -->
    <g transform="translate(18, 42)">
      <!-- Greeting / Header -->
      <text x="0" y="10" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8" font-weight="500">Total Net Balance</text>
      <text x="0" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">$4,280.00</text>
      
      <!-- Growth Pill -->
      <g transform="translate(0, 40)">
        <rect width="52" height="15" rx="7.5" fill="#dcfce7"/>
        <text x="26" y="10.5" fill="#15803d" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">+14.6%</text>
        <text x="58" y="11" fill="#94a3b8" font-family="sans-serif" font-size="7">vs last month</text>
      </g>

      <!-- Mini Chart -->
      <g transform="translate(0, 68)">
        <path d="M 0 45 Q 30 40 45 30 T 90 24 T 130 8 L 130 55 L 0 55 Z" fill="url(#financeLineGrad)"/>
        <path d="M 0 45 Q 30 40 45 30 T 90 24 T 130 8" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="130" cy="8" r="3" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      </g>

      <!-- Quick Action Icons -->
      <g transform="translate(4, 138)">
        <!-- Transfer -->
        <circle cx="18" cy="12" r="12" fill="#f1f5f9"/>
        <path d="M 14 12 L 22 12 M 19 9 L 22 12 L 19 15" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="33" fill="#64748b" font-family="sans-serif" font-size="6.5" font-weight="600" text-anchor="middle">Send</text>

        <!-- Receive -->
        <circle cx="63" cy="12" r="12" fill="#f1f5f9"/>
        <path d="M 63 8 L 63 16 M 60 13 L 63 16 L 66 13" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="63" y="33" fill="#64748b" font-family="sans-serif" font-size="6.5" font-weight="600" text-anchor="middle">Receive</text>

        <!-- Analytics -->
        <circle cx="108" cy="12" r="12" fill="#f1f5f9"/>
        <path d="M 103 16 L 103 12 M 108 16 L 108 9 M 113 16 L 113 14" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
        <text x="108" y="33" fill="#64748b" font-family="sans-serif" font-size="6.5" font-weight="600" text-anchor="middle">Stats</text>
      </g>

      <!-- Recent Transactions -->
      <g transform="translate(0, 192)">
        <text x="0" y="8" fill="#0f172a" font-family="sans-serif" font-size="8" font-weight="700">Recent Transactions</text>

        <!-- Row 1 -->
        <g transform="translate(0, 16)">
          <circle cx="10" cy="10" r="9" fill="#e0f2fe"/>
          <text x="10" y="13" fill="#0284c7" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">D</text>
          <text x="26" y="9" fill="#1e293b" font-family="sans-serif" font-size="7.5" font-weight="600">Dribbble Pro</text>
          <text x="26" y="17" fill="#94a3b8" font-family="sans-serif" font-size="6.5">Subscription</text>
          <text x="130" y="12" fill="#ef4444" font-family="sans-serif" font-size="7.5" font-weight="600" text-anchor="end">-$16.00</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 42)">
          <circle cx="10" cy="10" r="9" fill="#dcfce7"/>
          <text x="10" y="13" fill="#16a34a" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">S</text>
          <text x="26" y="9" fill="#1e293b" font-family="sans-serif" font-size="7.5" font-weight="600">Stripe Payout</text>
          <text x="26" y="17" fill="#94a3b8" font-family="sans-serif" font-size="6.5">Client project</text>
          <text x="130" y="12" fill="#16a34a" font-family="sans-serif" font-size="7.5" font-weight="600" text-anchor="end">+$1,250.00</text>
        </g>
      </g>
    </g>

    <!-- Home Indicator -->
    <rect x="55" y="322" width="70" height="3" rx="1.5" fill="#0f172a"/>
  </g>
</svg>
